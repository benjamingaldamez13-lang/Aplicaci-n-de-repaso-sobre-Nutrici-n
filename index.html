q(0,'Digestión y absorción',2,'¿En qué segmento del tubo digestivo se absorbe principalmente el hierro?',['Estómago','Duodeno y yeyuno proximal','Íleon terminal','Colon'],1,'El hierro se absorbe sobre todo en el duodeno y el yeyuno proximal. El íleon terminal absorbe B12 y sales biliares.','guy',['Hierro','Digestivo']);
q(3,'Hormonas digestivas',2,'¿Qué hormona intestinal estimula la secreción pancreática de bicarbonato en respuesta al pH ácido del duodeno?',['Gastrina','Secretina','Colecistoquinina','Grelina'],1,'La secretina (células S del duodeno) estimula una secreción pancreática y biliar rica en bicarbonato que neutraliza el quimo.','guy',['Hormonas','Digestivo']);
q(3,'Hormonas digestivas',1,'Llegan grasas y proteínas al duodeno. ¿Qué hormona se libera y cuál es su efecto principal?',['Gastrina: aumenta la secreción ácida gástrica','CCK: contrae la vesícula y estimula las enzimas pancreáticas','Insulina: aumenta la glucogénesis','Secretina: acelera el vaciamiento gástrico'],1,'La colecistoquinina (células I) contrae la vesícula, estimula la secreción enzimática del páncreas y retarda el vaciamiento gástrico, lo que favorece la digestión de grasas.','guy',['Hormonas','Digestivo','AltaImportancia']);
q(1,'Glucólisis',1,'¿Cuál es la enzima reguladora principal de la glucólisis?',['Hexoquinasa','Fosfofructoquinasa-1','Piruvato carboxilasa','Glucosa-6-fosfatasa'],1,'La PFK-1 cataliza el paso comprometido. La activan AMP y fructosa-2,6-bisfosfato; la inhiben ATP y citrato.','leh',['Metabolismo','Carbohidratos']);
q(1,'Glucólisis',2,'¿Qué célula obtiene su ATP solo de la glucólisis anaerobia por no tener mitocondrias?',['Hepatocito','Eritrocito','Neurona','Miocito cardíaco'],1,'Los eritrocitos maduros no tienen mitocondrias: dependen de glucosa y producen lactato.','leh',['Metabolismo']);
q(1,'Metabolismo de aminoácidos',2,'¿Cuál de los siguientes aminoácidos es exclusivamente cetogénico?',['Alanina','Leucina','Glutamina','Aspartato'],1,'La leucina y la lisina son exclusivamente cetogénicas. Los demás son glucogénicos.','leh',['Aminoácidos']);
q(2,'Biotina',3,'El consumo habitual de clara de huevo cruda puede favorecer una deficiencia de:',['Biotina','Vitamina C','Tiamina','Vitamina K'],0,'La avidina de la clara cruda se une a la biotina e impide su absorción. La cocción desnaturaliza la avidina.','ods',['B7']);
q(2,'Vitamina B6',2,'La ingesta crónica de dosis muy altas de vitamina B6 en suplementos puede causar neuropatía sensorial.',null,0,'Es la principal toxicidad de la B6. Por eso existe un límite superior tolerable para esta vitamina.','odsB6',['B6','Toxicidad']);
q(2,'Vitamina D',2,'¿Qué indicador se usa para evaluar el estado nutricional de vitamina D?',['1,25-dihidroxivitamina D','25-hidroxivitamina D [25(OH)D] sérica','Calcio ionizado','Fosfatasa alcalina'],1,'La 25(OH)D es la forma circulante principal y refleja ingesta y síntesis cutánea. La 1,25(OH)2D está regulada por la PTH.','odsD',['VitaminaD','Laboratorio']);
q(3,'Calcio',1,'Una caída de la calcemia estimula la PTH. ¿Cuál es su efecto?',['Disminuye la resorción ósea y aumenta la excreción renal de calcio','Aumenta la resorción ósea, la reabsorción renal de calcio y la activación de vitamina D','Aumenta la síntesis de insulina','Disminuye la absorción intestinal de calcio'],1,'La PTH eleva el calcio sérico por tres vías: hueso, riñón y activación de vitamina D. La calcitonina tiene efecto opuesto, menor en humanos.','guy',['PTH','Calcio','AltaImportancia']);
q(3,'Aldosterona',2,'¿Cuál es el efecto principal de la aldosterona en el túbulo distal y colector?',['Aumenta la reabsorción de Na⁺ y la excreción de K⁺','Disminuye la reabsorción de Na⁺','Aumenta la excreción de agua libre','Aumenta la reabsorción de K⁺'],0,'Retiene sodio y agua y elimina potasio. Es relevante en hipertensión, uso de diuréticos y enfermedad renal.','guy',['Aldosterona','HTA']);
q(4,'Intolerancia a la lactosa',1,'¿Cuál es la causa de la intolerancia a la lactosa?',['Reacción inmunológica mediada por IgE contra la caseína','Actividad insuficiente de la lactasa en el borde en cepillo intestinal','Déficit de sacarasa','Exceso de sales biliares'],1,'La lactosa no digerida llega al colon y se fermenta, con gas, distensión y diarrea. No es una alergia; la alergia a la proteína de la leche es inmunológica.','cat',['Lactosa','Intolerancia']);
q(4,'Diarrea aguda',1,'Niño con diarrea aguda y deshidratación leve. ¿Qué intervención es de primera elección?',['Suero de rehidratación oral y continuar la alimentación','Suspender todos los alimentos por 24 horas','Bebidas deportivas azucaradas','Antibióticos de rutina'],0,'La rehidratación oral es la base del tratamiento. Se mantiene la lactancia o alimentación. La OMS recomienda además zinc en niños con diarrea.','cat',['Diarrea','Pediatría']);
q(4,'Enfermedad hepática',1,'Según las guías EASL (2019), ¿qué se recomienda sobre la proteína en cirrosis?',['Restringirla a 0,5 g/kg/día para prevenir encefalopatía','Aportar aproximadamente 1,2–1,5 g/kg/día','Evitar por completo la proteína animal','Indicar solo aminoácidos intravenosos'],1,'La cirrosis es un estado catabólico con riesgo de sarcopenia; restringir proteína empeora el estado nutricional. Se recomiendan comidas frecuentes y un refrigerio nocturno. Los valores se individualizan.','easl',['Hepática','AltaImportancia']);
q(5,'Laboratorio',2,'¿Qué proteína sérica tiene la vida media más corta (cerca de 2 días)?',['Albúmina','Prealbúmina (transtiretina)','Transferrina','Ferritina'],1,'Albúmina: cerca de 20 días; transferrina: cerca de 8 días; prealbúmina: cerca de 2 días. Son reactantes de fase aguda negativos y no deben usarse solos para diagnosticar desnutrición.','cat',['Laboratorio','Proteínas']);
q(6,'Lactancia',1,'Según la OMS, ¿hasta qué edad se recomienda continuar la lactancia materna junto con alimentos complementarios?',['Hasta los 6 meses','Hasta los 12 meses','Hasta los 2 años o más','Hasta los 4 años'],2,'Lactancia exclusiva durante los primeros 6 meses; después, alimentos complementarios y lactancia hasta los 2 años o más.','oms',['Lactancia','Pediatría']);
q(6,'Adulto mayor',2,'¿Qué herramienta de tamizaje se usa ampliamente para detectar riesgo de desnutrición en adultos mayores?',['Mini Nutritional Assessment (MNA)','Escala de Apgar','Índice de Katz','Escala de Glasgow'],0,'El MNA y su versión corta (MNA-SF) evalúan ingesta, pérdida de peso, movilidad, estrés y antropometría. El índice de Katz mide actividades de la vida diaria.','cat',['Adulto mayor','Tamizaje']);
f(0,'Digestión y absorción',2,'¿Qué enzima inicia la digestión del almidón y dónde actúa?','Amilasa salival, en la boca. La amilasa pancreática continúa en el intestino delgado.','La amilasa salival se inactiva con el pH ácido del estómago.','guy',['Digestivo','Carbohidratos']);
f(1,'Vías metabólicas',1,'Ciclo de Cori: ¿qué es?','El músculo en ejercicio intenso produce lactato; este viaja al hígado, que lo convierte en glucosa por gluconeogénesis y la devuelve a la sangre.','Conecta la glucólisis anaerobia del músculo con la gluconeogénesis hepática.','leh',['Metabolismo']);
f(2,'Vitamina E',2,'Función principal de la vitamina E','Antioxidante liposoluble que protege las membranas celulares de la peroxidación lipídica.','La deficiencia es rara; puede aparecer en malabsorción de grasas.','odsE',['VitaminaE','ADEK']);
f(2,'Folato',1,'Fuentes alimentarias de folato','Verduras de hoja verde, leguminosas, cítricos, hígado y cereales fortificados.','El ácido fólico sintético se absorbe mejor que el folato de los alimentos.','odsFolate',['Folato']);
f(2,'Magnesio',2,'Funciones del magnesio','Cofactor de más de 300 sistemas enzimáticos (metabolismo del ATP, síntesis proteica), contracción muscular y función nerviosa.','Fuentes: semillas, frutos secos, leguminosas y verduras de hoja verde.','odsMg',['Magnesio']);
f(3,'ADH',1,'ADH: estímulo y efecto','Se libera con aumento de la osmolaridad o disminución del volumen; aumenta la reabsorción de agua en el túbulo colector y concentra la orina.','Su déficit causa diabetes insípida, con poliuria.','guy',['ADH']);
f(3,'Hormonas tiroideas',1,'Efecto de las hormonas tiroideas sobre el metabolismo','T3 y T4 aumentan la tasa metabólica basal. Hipotiroidismo: menor gasto energético, aumento de peso e intolerancia al frío. Hipertiroidismo: pérdida de peso con apetito aumentado.','El yodo es indispensable para sintetizarlas.','guy',['T3','T4']);
f(4,'Hipertensión',1,'Metas de sodio en el patrón DASH','Versión estándar: hasta 2 300 mg de sodio al día. Versión baja en sodio: 1 500 mg al día.','Valores de la guía del NHLBI.','dash',['HTA','Sodio']);
f(4,'Celiaquía',1,'Tratamiento nutricional de la enfermedad celíaca','Dieta estricta sin gluten (trigo, cebada, centeno) de por vida, evitando contaminación cruzada y revisando etiquetas.','Vigilar deficiencias de hierro, folato, calcio y vitamina D.','cel',['Celiaquía']);
f(4,'Fibra',2,'Fibra soluble vs insoluble','Soluble (avena, leguminosas, frutas): forma gel, reduce el LDL y modera la glucemia. Insoluble (salvado, granos integrales): aumenta el bolo fecal y acelera el tránsito.','La fibra insoluble ayuda en el estreñimiento.','aha',['Fibra']);
f(5,'Evaluación nutricional',1,'Componentes de la Valoración Global Subjetiva (VGS)','Historia: cambio de peso, ingesta, síntomas gastrointestinales, capacidad funcional y enfermedad o estrés metabólico. Examen físico: pérdida de grasa y de músculo, edema y ascitis.','Clasifica al paciente en bien nutrido, desnutrición moderada o sospecha, y desnutrición grave.','cat',['VGS']);
f(5,'Evaluación nutricional',2,'Criterio clásico de pérdida de peso importante (Blackburn)','5 % en 1 mes, 7,5 % en 3 meses o 10 % en 6 meses.','Algunos textos llaman «significativa» a esos valores y «grave» a lo que los supera; confirma cuál usa tu cátedra.','cat',['Peso','Evaluación']);
f(7,'Vigilancia nutricional',2,'¿Qué es la vigilancia nutricional?','Observación continua y sistemática del estado nutricional de una población y de sus determinantes, para orientar decisiones y acciones.','Se apoya en indicadores como talla/edad, peso/talla y prevalencia de anemia.','cat',['SAN','Vigilancia']);

q(6,'Prematuros',1,'Un prematuro nació a las 32 semanas y llega a consulta con 4 meses y 2 semanas de edad cronológica. ¿Cuál es su edad corregida?',['4 meses y 2 semanas','2 meses y 2 semanas','6 meses y 2 semanas','1 mes'],1,'Ajuste de prematurez = 40 − 32 = 8 semanas = 2 meses. Edad corregida = 4 meses y 2 semanas − 2 meses = 2 meses y 2 semanas.','mProg',['MaterialPropio','Prematuros','Cálculos'],'Prematuro nacido a las 32 semanas de edad gestacional, evaluado a los 4 meses y 2 semanas de edad cronológica.');

q(6,'Antropometría pediátrica',1,'En niños menores de 2 años, ¿qué índice se usa para clasificar desnutrición según tu material?',['Peso/Talla','IMC/Edad','Peso/Edad','Talla/Edad'],2,'Menores de 2 años: Peso/Edad. De 2 a 5 años: Peso/Talla. De 5 a 19 años: IMC/Edad y Talla/Edad. Algunas referencias OMS también usan peso/longitud en menores de 2 años; sigue el lineamiento de tu cátedra.','mProg+oms2',['MaterialPropio','Antropometría','Pediatría']);
f(6,'Antropometría pediátrica',1,'Índices por grupo de edad y siglas del registro (según tu material)','Menores de 2 años: Peso/Edad. De 2 a 5 años: Peso/Talla. De 5 a 19 años: IMC/Edad y Talla/Edad. Siglas: O = obesidad, SP = sobrepeso, N = normal, D = desnutrición, DS = desnutrición severa.','En los menores de 2 años la curva de Peso/Edad no se usa para clasificar sobrepeso u obesidad.','mProg+oms2',['MaterialPropio','Antropometría','Pediatría']);
q(6,'Embarazo',2,'En una embarazada de 20 a 49 años con más de 12 semanas de gestación, ¿qué instrumento se usa para evaluar su estado nutricional?',['Tabla OMS de IMC pregestacional','Gráfica de evaluación nutricional de la embarazada según IMC','Curva de crecimiento pediátrico','Perímetro braquial'],1,'Después de las 12 semanas se grafica el IMC con la edad gestacional. En adolescentes embarazadas (10–19 años) antes de las 12 semanas se usa la gráfica de crecimiento de IMC.','mProg',['MaterialPropio','Embarazo','Antropometría']);

f(7,'Normativa escolar',2,'Nutrientes críticos del perfil de nutrientes de la OPS para tiendas escolares','Sodio, azúcares libres, otros edulcorantes, total de grasas, grasas saturadas y grasas trans.','Son 6 nutrientes críticos.','mProg',['MaterialPropio','Normativa','Etiquetado']);

q(7,'APS',2,'La Carta de Ottawa (1986) propone lograr salud para todos mediante:',['Hospitales de alta complejidad','Promoción de la salud con medidas no solo médicas','Privatización de los servicios','Vacunación exclusivamente'],1,'Ottawa 1986: promoción de la salud, con medidas que van más allá de lo médico.','mAPS',['MaterialPropio','APS']);
f(7,'APS',2,'Elementos de la definición de APS: esencialidad, accesibilidad y equidad','Esencialidad: discrimina qué recursos y tecnologías son más esenciales según el contexto. Accesibilidad: sobre todo geográfica, también económica y cultural. Equidad: distribución según la necesidad.','Equidad no es igualdad.','mAPS',['MaterialPropio','APS']);
q(7,'Sistemas de salud',2,'¿Cuáles son los 3 valores de un sistema de salud basado en la APS (OPS, 2007)?',['Cobertura, financiamiento y gobernanza','Derecho al nivel de salud más alto posible, equidad y solidaridad','Promoción, prevención y curación','Accesibilidad, esencialidad y sustentabilidad'],1,'Los valores son el derecho al nivel de salud más alto posible, la equidad y la solidaridad.','mAPS',['MaterialPropio','APS']);
q(7,'APS y nutrición',2,'¿Cuáles son los 3 ámbitos estratégicos de la nutrición en la APS?',['Diagnóstico, tratamiento y seguimiento','Intervenciones tempranas, manejo de enfermedades crónicas y salud comunitaria','Promoción, prevención y rehabilitación','Disponibilidad, acceso y utilización biológica'],1,'Intervenciones tempranas (embarazo y primeros 1 000 días), manejo de enfermedades crónicas y salud comunitaria.','mAPS',['MaterialPropio','APS','Nutrición']);

q(7,'Salud pública',2,'¿Quién definió la salud pública como la ciencia y el arte de prevenir enfermedades, prolongar la vida y fomentar la salud mediante el esfuerzo organizado de la comunidad?',['Piédrola','Winslow (1920)','OMS','Lalonde'],1,'Es la definición clásica de Winslow (1920).','mSP',['MaterialPropio','SaludPública']);
q(7,'Salud pública',2,'La detección precoz y el tratamiento oportuno de una enfermedad corresponden a prevención:',['Primaria','Secundaria','Terciaria','Cuaternaria'],1,'Secundaria: fase presintomática. Primaria: antes de la enfermedad. Terciaria: rehabilitación y limitación de secuelas.','mSP',['MaterialPropio','SaludPública','Prevención']);
q(7,'Determinantes',1,'Según el modelo de Lalonde (1974), ¿qué determinante tiene mayor peso en la salud?',['Sistema de salud (11 %)','Medio ambiente (19 %)','Biología humana (27 %)','Estilo de vida (43 %)'],3,'Los cuatro determinantes son biología humana, medio ambiente, estilo de vida y organización del sistema de salud. Los porcentajes son los de tu material.','mSP',['MaterialPropio','Determinantes','AltaImportancia']);
q(7,'Determinantes',2,'La OMS define los determinantes sociales de la salud como:',['Solo los factores genéticos','Las circunstancias en que las personas nacen, crecen, trabajan, viven y envejecen','Los medicamentos disponibles','El clima de una región'],1,'Incluye las fuerzas y sistemas más amplios que influyen en la vida cotidiana. Educación, ocupación, ingresos, género y raza son estratificadores sociales (determinantes estructurales).','mSP',['MaterialPropio','Determinantes']);
q(7,'Modelos salud-enfermedad',2,'El modelo multicausal (Leavell y Clark) plantea que la salud-enfermedad depende de la interacción de:',['Genes y ambiente','Agente, huésped y ambiente','Estado y sociedad civil','Pobreza y desempleo'],1,'Su limitación es que no jerarquiza el peso de cada factor.','mSP',['MaterialPropio','Modelos']);
q(7,'Epidemiología nutricional',2,'El indicador peso/talla se usa para identificar:',['Desnutrición crónica','Desnutrición global','Desnutrición aguda','Deficiencia de yodo'],2,'Talla/edad: desnutrición crónica. Peso/edad: desnutrición global. Peso/talla: desnutrición aguda.','mSP+oms2',['MaterialPropio','Antropometría','Epidemiología']);
f(7,'Salud pública',2,'Funciones de la salud pública y funciones esenciales (FESP)','Cuatro funciones: protección, prevención, promoción y restauración de la salud. Tu material menciona 11 funciones esenciales de salud pública (versión OPS/OMS de 2002).','La OPS ha actualizado este marco desde entonces; confirma qué versión usa tu cátedra.','mSP',['MaterialPropio','SaludPública']);
f(7,'Nutrición pública',3,'Hot Spring (1943) y Pedro Escudero','Hot Spring (1943): conferencia que vinculó enfermedades y deficiencias nutricionales, antecedente de la FAO. Pedro Escudero: pionero de la nutrición en América Latina (institutos en los años 30).','Datos históricos tomados de tu material.','mSP',['MaterialPropio','Historia']);

q(2,'Riboflavina',2,'Un signo característico de la deficiencia de riboflavina (B2) es:',['Queilosis y estomatitis angular','Ceguera nocturna','Gingivorragia','Edema con fóvea'],0,'La B2 es precursora de FAD y FMN. Su deficiencia produce queilosis, estomatitis angular, glositis y dermatitis seborreica.','odsB2',['B2']);
f(2,'Cobre',2,'Funciones y deficiencia del cobre','Cofactor de la ceruloplasmina (oxida el hierro para su transporte), de la citocromo c oxidasa y de la superóxido dismutasa. Su deficiencia causa anemia que no responde al hierro y neutropenia.','El exceso de zinc es una causa de deficiencia de cobre.','odsCu',['Cobre','Anemia']);
f(2,'Fósforo',2,'¿Dónde se encuentra el fósforo del organismo y qué funciones tiene?','Cerca del 85 % está en huesos y dientes (hidroxiapatita, junto al calcio). También forma parte del ATP, los fosfolípidos y el ADN.','En la enfermedad renal crónica se retiene fósforo y se controla su ingesta.','odsP',['Fósforo']);
q(2,'Vitamina D',2,'La vitamina D3 se sintetiza en la piel a partir de:',['7-deshidrocolesterol por acción de la radiación UVB','Betacaroteno por acción del calor','Triptófano en presencia de luz','Ergosterol de los alimentos'],0,'La radiación UVB convierte el 7-deshidrocolesterol de la piel en previtamina D3. El estado de vitamina D se mide con 25(OH)D.','odsD',['VitaminaD']);
q(1,'Ciclo de Krebs',2,'¿Dónde ocurre el ciclo de Krebs y qué coenzimas reducidas genera principalmente?',['Citosol; ATP directo','Matriz mitocondrial; NADH y FADH₂','Membrana mitocondrial externa; lactato','Núcleo; NADPH'],1,'Ocurre en la matriz mitocondrial. Genera sobre todo NADH y FADH₂ (y un GTP o ATP por vuelta), que alimentan la cadena respiratoria.','leh',['Metabolismo','AltaImportancia']);
q(1,'Cadena respiratoria',2,'¿Cuál es el aceptor final de electrones en la cadena respiratoria?',['NAD⁺','Oxígeno','CO₂','Piruvato'],1,'El oxígeno acepta los electrones en el complejo IV y forma agua. El gradiente de protones impulsa la ATP sintasa.','leh',['Metabolismo']);
f(1,'Lipoproteínas',1,'HDL vs LDL: ¿qué función tiene cada una?','LDL: lleva colesterol del hígado a los tejidos; su exceso favorece la aterosclerosis. HDL: participa en el transporte reverso del colesterol, de los tejidos al hígado.','Quilomicrones: triglicéridos de la dieta. VLDL: triglicéridos que produce el hígado.','leh+aha',['Lípidos','Dislipidemia']);
q(1,'Colesterol',2,'Las estatinas reducen el colesterol porque inhiben:',['HMG-CoA reductasa','Lipasa pancreática','Carnitina aciltransferasa','Acetil-CoA carboxilasa'],0,'La HMG-CoA reductasa es la enzima limitante de la síntesis de colesterol. Inhibirla reduce el colesterol hepático y aumenta los receptores de LDL.','leh',['Lípidos','Colesterol']);
f(1,'Glucógeno',1,'Glucogenólisis hepática vs muscular','El hígado libera glucosa a la sangre (tiene glucosa-6-fosfatasa) y mantiene la glucemia en ayuno. El músculo usa su glucógeno solo para sí mismo (no tiene glucosa-6-fosfatasa).','En el hígado la activan el glucagón y la adrenalina; la insulina la inhibe.','leh',['Metabolismo','Glucógeno']);
q(3,'Adrenalina',2,'¿Qué efecto metabólico tiene la adrenalina durante el estrés agudo?',['Aumenta la glucogenólisis y la lipólisis','Aumenta la síntesis de glucógeno','Disminuye la glucemia','Inhibe la lipólisis'],0,'La adrenalina (médula suprarrenal) eleva la glucemia por glucogenólisis y gluconeogénesis, y moviliza ácidos grasos por lipólisis.','guy',['Adrenalina','Estrés']);
f(3,'Hormona de crecimiento',2,'GH e IGF-1: efectos metabólicos','La GH (hipófisis) estimula el crecimiento a través del IGF-1 hepático. Además es antagonista de la insulina: aumenta la lipólisis y reduce la captación de glucosa.','Su secreción aumenta con el sueño profundo, el ayuno y la hipoglucemia.','guy',['GH','IGF1']);
q(3,'Gastrina',2,'¿Qué hormona estimula la secreción de HCl por las células parietales del estómago?',['Gastrina','Secretina','Somatostatina','Leptina'],0,'La gastrina (células G del antro) estimula la secreción ácida. La somatostatina la inhibe.','guy',['Gastrina','Digestivo']);
f(3,'Hormonas sexuales',3,'Estrógenos, progesterona y testosterona: efectos relevantes en nutrición','Estrógenos: protegen la densidad ósea; su caída en la menopausia aumenta el riesgo de osteoporosis. Progesterona: aumenta la temperatura y el metabolismo basal en la fase lútea. Testosterona: favorece la masa muscular y la síntesis proteica.','Por eso se evita la fase lútea al medir por bioimpedancia.','guy',['Estrógenos','Testosterona']);
q(3,'Eje tiroideo',2,'En el hipotiroidismo primario, ¿qué patrón hormonal se espera?',['TSH elevada y T4 baja','TSH baja y T4 alta','TSH y T4 elevadas','TSH y T4 normales'],0,'Si la glándula falla, la T4 baja y la hipófisis aumenta la TSH por retroalimentación negativa. En el hipertiroidismo primario ocurre lo contrario.','guy',['TSH','T4']);
q(4,'Gastritis',2,'¿Cuál es la causa infecciosa más frecuente de gastritis crónica?',['Helicobacter pylori','Escherichia coli','Salmonella','Giardia lamblia'],0,'H. pylori es la causa más frecuente. La gastritis atrófica reduce el ácido y el factor intrínseco, con riesgo de deficiencia de B12 y de hierro.','cat+odsB12',['Gastritis','Digestivo']);
f(4,'Estreñimiento',2,'Manejo nutricional del estreñimiento funcional','Aumentar la fibra de forma gradual (frutas, verduras, granos integrales, leguminosas), con hidratación adecuada y actividad física.','Aumentar la fibra sin líquidos puede empeorar el estreñimiento.','cat',['Estreñimiento','Fibra']);
f(4,'Cáncer',2,'¿Qué es la caquexia asociada al cáncer?','Síndrome multifactorial con pérdida de masa muscular (con o sin pérdida de grasa) que el soporte nutricional convencional no revierte por completo, asociado a inflamación y anorexia.','No es lo mismo que la desnutrición por ingesta insuficiente simple.','espenCa',['Cáncer','Desnutrición']);
q(4,'Enfermedad cardiovascular',2,'¿Cuál es una recomendación de la AHA (2021) para mejorar la salud cardiovascular?',['Elegir granos integrales, frutas, verduras, proteínas vegetales y pescado, y limitar sodio y azúcares añadidos','Aumentar las grasas saturadas','Eliminar todas las grasas de la dieta','Evitar siempre las frutas por su azúcar'],0,'La guía de 2021 destaca un patrón basado en alimentos poco procesados, con limitación de sodio, azúcares añadidos y alcohol.','aha',['ECV','AltaImportancia']);
q(6,'Diabetes gestacional',1,'Según la ADA, ¿cuándo se recomienda tamizar la diabetes gestacional en embarazadas sin diabetes previa?',['A las 24–28 semanas de gestación','A las 8–10 semanas','Solo a las 36 semanas','No se recomienda tamizar'],0,'ADA: tamizaje a las 24–28 semanas con prueba de tolerancia oral a la glucosa. Con factores de riesgo puede hacerse antes.','ada',['Embarazo','DiabetesGestacional']);
q(6,'Preeclampsia',2,'¿Cómo se define la preeclampsia?',['Presión arterial ≥140/90 mmHg después de las 20 semanas con proteinuria o disfunción de órgano blanco','Aumento de peso mayor de 1 kg por semana','Glucemia en ayunas ≥92 mg/dL durante el embarazo','Hemoglobina menor de 11 g/dL en el tercer trimestre'],0,'Hipertensión de inicio después de las 20 semanas más proteinuria o disfunción de órganos. Los criterios se actualizan en las guías.','acog',['Embarazo','Preeclampsia']);
f(6,'Alimentación complementaria',2,'Características de una alimentación complementaria adecuada (OMS)','Oportuna (desde los 6 meses), adecuada en cantidad y calidad, segura en higiene y preparación, y administrada respondiendo a las señales de hambre y saciedad.','Se continúa la lactancia materna.','oms',['Pediatría','AlimentaciónComplementaria']);
q(6,'Adolescencia',2,'¿Qué micronutriente requiere especial atención en las adolescentes por pérdidas menstruales y crecimiento?',['Hierro','Vitamina K','Sodio','Vitamina E'],0,'La menstruación y el estirón puberal aumentan los requerimientos de hierro y la anemia ferropénica es frecuente. También aumenta la necesidad de calcio por el pico de masa ósea.','odsFe',['Adolescencia','Hierro']);
q(5,'Evaluación dietética',2,'El cuestionario de frecuencia de consumo se usa principalmente para estimar:',['La ingesta habitual a largo plazo','La ingesta exacta de un solo día','El gasto energético','La composición corporal'],0,'El recordatorio de 24 horas describe la ingesta de un día y debe repetirse. El cuestionario de frecuencia estima la ingesta habitual. Ambos dependen de la memoria.','cat',['Evaluación dietética']);
f(5,'Nutrición enteral y parenteral',2,'¿Cuándo se prefiere la nutrición enteral sobre la parenteral?','Cuando el tracto gastrointestinal funciona pero la ingesta oral no basta. Conserva la integridad de la mucosa intestinal y reduce complicaciones infecciosas.','La parenteral se reserva para cuando la vía enteral no es posible o no cubre los requerimientos.','cat',['NutriciónClínica','Enteral']);
f(5,'Requerimientos energéticos',2,'Ecuaciones para estimar el gasto energético en reposo del adulto','Harris-Benedict y Mifflin-St Jeor son las más usadas. El resultado se multiplica por un factor de actividad (y de estrés si hay enfermedad).','Para el examen, usa la ecuación que indique tu cátedra.','cat',['Requerimientos','Cálculos']);

// ---- Ampliación 6 (19 flashcards + 16 preguntas)
// Flashcards
f(7,'Epidemiología',1,'Incidencia vs prevalencia','Incidencia: casos nuevos de una enfermedad en una población durante un período. Prevalencia: todos los casos existentes (nuevos y antiguos) en un momento o período.','En condiciones estables, prevalencia ≈ incidencia × duración de la enfermedad.','cat',['Epidemiología','AltaImportancia']);
f(7,'Epidemiología',2,'Casos y controles vs cohortes','Casos y controles: parte de personas con y sin la enfermedad y busca la exposición pasada (mide el OR). Cohortes: sigue grupos expuestos y no expuestos hasta ver si aparece la enfermedad (mide el riesgo relativo).','El ensayo clínico aleatorizado es el diseño experimental.','cat',['Epidemiología']);
f(7,'Epidemiología',2,'Sensibilidad vs especificidad de una prueba','Sensibilidad: capacidad de identificar correctamente a los enfermos. Especificidad: capacidad de identificar correctamente a los sanos.','Las pruebas de tamizaje buscan alta sensibilidad.','cat',['Epidemiología','Tamizaje']);
f(7,'Prevención',1,'Ejemplos de prevención primaria, secundaria y terciaria','Primaria: vacunación, educación alimentaria, promoción de la lactancia. Secundaria: tamizaje y detección precoz (glucemia, anemia). Terciaria: rehabilitación y control de complicaciones.','La prevención cuaternaria busca evitar el exceso de intervenciones médicas.','mSP',['SaludPública','Prevención']);
f(7,'Educación alimentaria',2,'¿Qué es la educación alimentaria y nutricional (EAN)?','Conjunto de actividades educativas que facilitan la adopción voluntaria de conductas alimentarias saludables, adaptadas a la cultura y a los alimentos disponibles.','Se trabaja con participación de la comunidad.','cat',['EAN','Comunitaria']);
f(7,'Guías alimentarias',2,'¿Qué son las guías alimentarias basadas en alimentos?','Herramientas educativas que traducen las recomendaciones de nutrientes en mensajes sobre alimentos, adaptados a la cultura y a la disponibilidad de cada país.','Su objetivo es orientar a la población hacia una alimentación saludable.','cat',['GABA','Comunitaria']);
f(7,'Etiquetado nutricional',2,'¿Qué se revisa primero al leer una etiqueta nutricional?','El tamaño de la porción y el número de porciones por envase; luego la energía y los nutrientes, y por último la lista de ingredientes (ordenados de mayor a menor cantidad).','Los azúcares pueden aparecer como jarabes, dextrosa o maltosa.','cat',['Etiquetado']);
f(7,'Seguridad alimentaria',2,'¿Qué mide la ELCSA?','La Escala Latinoamericana y Caribeña de Seguridad Alimentaria mide la inseguridad alimentaria en el hogar según la experiencia de las personas (preocupación, menor calidad y cantidad, hambre) y la clasifica en leve, moderada y severa.','Se basa en la experiencia del hogar, no en un consumo medido.','cat',['SAN']);
f(5,'Requerimientos energéticos',2,'¿Cuál es el método de referencia para medir el gasto energético en reposo?','Calorimetría indirecta, que mide el consumo de oxígeno y la producción de CO₂.','Las ecuaciones predictivas solo lo estiman.','cat',['Requerimientos']);
f(5,'Metabolismo energético',2,'Cociente respiratorio (RQ) de cada macronutriente','Carbohidratos: 1,0. Proteínas: cerca de 0,8. Lípidos: cerca de 0,7. Dieta mixta: cerca de 0,85.','Un RQ mayor de 1 sugiere lipogénesis por sobrealimentación.','guy',['Metabolismo','Requerimientos']);
f(5,'Gasto energético',2,'Componentes del gasto energético total','Metabolismo basal (la mayor parte, cerca de 60–70 %), efecto térmico de los alimentos (cerca de 10 %) y actividad física (el componente más variable).','Las proteínas tienen el mayor efecto térmico.','cat',['Requerimientos']);
f(5,'Laboratorio',2,'Valores de referencia: triglicéridos y glucemia en ayunas','Triglicéridos normales: menos de 150 mg/dL. Glucemia en ayunas: normal menos de 100 mg/dL; alterada 100–125 mg/dL; diabetes 126 mg/dL o más (confirmada).','Valores de la ADA y de los criterios armonizados del síndrome metabólico.','ada+alberti',['Laboratorio']);
f(5,'Evaluación nutricional',1,'Componentes de la evaluación nutricional (ABCD)','Antropométricos, bioquímicos, clínicos y dietéticos.','El diagnóstico nutricional integra los cuatro.','cat',['Evaluación']);
f(5,'Antropometría',2,'Circunferencia de cintura y riesgo cardiometabólico','Mide la grasa abdominal, que se asocia más con resistencia a la insulina y enfermedad cardiovascular que el IMC solo.','Los puntos de corte varían según la población. En tu material: más de 102 cm en hombres y más de 88 cm en mujeres.','alberti+mProg',['Antropometría','Cintura']);
f(4,'Enfermedad renal',2,'¿Por qué se limita el potasio y el fósforo en la ERC avanzada?','El riñón reduce su excreción: el potasio alto puede causar arritmias y el fósforo alto altera el metabolismo mineral óseo.','Se ajusta según los valores séricos de potasio y fósforo.','kdoqi',['ERC']);
f(4,'Diarrea',2,'Signos de deshidratación en un niño','Sed, ojos hundidos, mucosas secas, pliegue cutáneo que regresa lentamente, llanto sin lágrimas y decaimiento.','Se clasifica en sin deshidratación, algún grado de deshidratación y deshidratación grave.','cat',['Diarrea','Pediatría']);
f(4,'Enfermedades tiroideas',2,'Recomendaciones nutricionales en el hipotiroidismo','Asegurar una ingesta adecuada de yodo y selenio, y tomar la levotiroxina en ayunas, separada de suplementos de hierro y calcio.','El hierro y el calcio reducen la absorción de la levotiroxina.','cat',['Tiroides']);
f(4,'Alergias alimentarias',2,'Alérgenos alimentarios más comunes','Leche, huevo, pescado, mariscos, cacahuate, frutos secos, soya y trigo.','En la alergia se excluye el alérgeno y se revisan siempre las etiquetas.','cat',['Alergia']);
f(4,'Desnutrición',2,'Manejo inicial de la desnutrición aguda grave: ¿qué se evita al principio?','Sobrealimentar. Primero se corrigen hipoglucemia, hipotermia, deshidratación y electrolitos, y se inicia la alimentación terapéutica de forma gradual.','Así se previene el síndrome de realimentación.','oms13+aspen',['Desnutrición','Realimentación']);

q(7,'Indicadores de salud',2,'La tasa de mortalidad infantil se expresa como muertes de menores de un año por cada:',['100 nacidos vivos','1 000 nacidos vivos','10 000 habitantes','100 000 habitantes'],1,'Mortalidad infantil: por 1 000 nacidos vivos. La razón de mortalidad materna se expresa por 100 000 nacidos vivos.','cat',['Indicadores','AltaImportancia']);
q(7,'Indicadores de salud',2,'La razón de mortalidad materna se expresa por cada:',['1 000 nacidos vivos','10 000 nacidos vivos','100 000 nacidos vivos','100 000 habitantes'],2,'Muertes maternas por 100 000 nacidos vivos.','cat',['Indicadores']);
q(7,'Epidemiología',2,'Un estudio transversal (de corte) permite estimar principalmente:',['La prevalencia en un momento dado','La incidencia acumulada','El efecto de una intervención','La supervivencia'],0,'Mide exposición y enfermedad al mismo tiempo, por lo que da la prevalencia. La incidencia requiere seguimiento en el tiempo.','cat',['Epidemiología']);
q(7,'Nutrición materno-infantil',2,'Los primeros 1 000 días de vida comprenden:',['Desde la concepción hasta los 2 años','Desde el nacimiento hasta los 3 años','Solo el embarazo y el primer año','Desde los 6 meses hasta los 5 años'],0,'Cerca de 270 días de embarazo más 730 de los dos primeros años. Es una ventana crítica para la nutrición y el desarrollo.','cat',['1000Días','Pediatría']);
q(7,'Deficiencia de yodo',2,'¿Cuál es la estrategia poblacional más usada para prevenir la deficiencia de yodo?',['Yodación universal de la sal','Suplementar solo a adultos mayores','Agua embotellada con yodo','Inyecciones anuales de yodo'],0,'La OMS recomienda la fortificación de la sal con yodo como estrategia de salud pública para prevenir los trastornos por deficiencia de yodo.','omsSal',['Yodo','Fortificación']);
q(5,'Diagnóstico nutricional',2,'En un diagnóstico PES, ¿qué parte se redacta después de «relacionado con»?',['La etiología','Los signos y síntomas','El problema','La intervención'],0,'Se redacta: «Problema, relacionado con etiología, evidenciado por signos y síntomas».','and',['NCP','PES']);

function calc(){const p=+$('#cp').value,t=+$('#ct').value,h=+$('#ch').value,m=$('#cs').value=='m',k=+$('#ck').value,c=+$('#cc').value,pr=+$('#cq').value,l=+$('#cl').value,mt=t/100,imc=p/(mt*mt),inch=t/2.54,ideal=m?48+2.7*(inch-60):45.5+2.3*(inch-60),aj=ideal+.25*(p-ideal),pp=100*(h-p)/h,ad=100*p/ideal,g=x=>(k*x/100);$('#co').innerHTML=`<div class="ov"><table><tr><th>Cálculo</th><th>Fórmula</th><th>Resultado</th></tr><tr><td>IMC</td><td>peso / talla² (m)</td><td>${imc.toFixed(1)} kg/m²</td></tr><tr><td>% pérdida de peso</td><td>(habitual − actual) / habitual × 100</td><td>${pp.toFixed(1)}%</td></tr><tr><td>Peso ideal (Hamwi)</td><td>${m?'48 kg + 2,7 kg por pulgada >60':'45,5 kg + 2,3 kg por pulgada >60'}</td><td>${ideal.toFixed(1)} kg</td></tr><tr><td>% adecuación de peso</td><td>actual / ideal × 100</td><td>${ad.toFixed(0)}%</td></tr><tr><td>Peso ajustado</td><td>ideal + 0,25 × (actual − ideal)</td><td>${aj.toFixed(1)} kg</td></tr><tr><td>Macronutrientes</td><td>CHO y proteína 4 kcal/g; lípidos 9 kcal/g</td><td>CHO ${(g(c)/4).toFixed(0)} g · Prot ${(g(pr)/4).toFixed(0)} g · Lip ${(g(l)/9).toFixed(0)} g${c+pr+l!=100?' ⚠ suma ≠ 100%':''}</td></tr></table></div><p class="mu">Existen otras fórmulas de peso ideal y de requerimiento energético; confirma cuál usa tu cátedra.</p>`}
VW.dt=function(){const L=['Fisiopatología','Objetivos','Priorizar','Limitar','Seguimiento','Error frecuente'];V.innerHTML='<div class="warn">Razonamiento nutricional, no listas de permitido/prohibido. Complementa con Krause (Dietoterapia) en la edición de tu cátedra.</div><br>'+DT.map(d=>`<div class="cd"><b>${d[0]}</b><div class="ov"><table>${L.map((l,i)=>`<tr><th>${l}</th><td>${d[i+1]}</td></tr>`).join('')}</table></div>${rfs(d[7])}</div>`).join('')};
VW.tb=function(){const o=HB.map((h,i)=>`<option value="${i}">${h[0]}</option>`).join('');V.innerHTML=`<div class="cd"><b>Hemoglobina para diagnosticar anemia (g/dL, al nivel del mar)</b> <span class="tag">Material de cátedra · Módulo X-2026</span><div class="ov"><table><tr><th>Población</th><th>Sin anemia</th><th>Leve</th><th>Moderada</th><th>Grave</th></tr>${HB.map(h=>`<tr><td>${h[0]}</td><td>${h[4]}</td><td>${h[5]}</td><td>${h[6]}</td><td>${h[7]}</td></tr>`).join('')}</table></div><p class="warn">* Tu diapositiva muestra 10.0–12.9 para varones. La tabla OMS 2011 indica 11.0–12.9 (con 10.0–10.9 como moderada). Confírmalo con tu docente. La OMS publicó una guía actualizada en 2024; para el examen usa la tabla de tu cátedra.</p>${rfs('hbcat+oms11')}<div class="row"><select id="hbp">${o}</select><input id="hbv" type="number" step="0.1" placeholder="Hb g/dL" style="width:110px"><button class="p" onclick="hbc()">Clasificar</button></div><div id="hbo"></div></div><div class="cd"><b>Hemoglobina glucosilada (HbA1c)</b> <span class="tag">Material de cátedra</span><div class="ov"><table><tr><th>Valor</th><th>Interpretación</th></tr><tr><td>4.0–5.6 %</td><td>Normal; esperado en no diabéticos</td></tr><tr><td>5.7–6.4 %</td><td>Prediabetes: alto riesgo de diabetes a corto plazo</td></tr><tr><td>6.5–7.0 % sin diagnóstico previo</td><td>Diabetes</td></tr><tr><td>6.5–7.0 % con diabetes en tratamiento</td><td>Control adecuado (resultado deseado)</td></tr><tr><td>7.0–7.9 %</td><td>Anormal en adultos; puede tolerarse en adultos mayores o niños por riesgo de hipoglucemia</td></tr><tr><td>Más de 8.0 %</td><td>Diabetes mal controlada</td></tr></table></div><p class="warn">En el material el valor 7.0 aparece en dos rangos y no se cubre 7.9–8.0. En la ADA, diagnóstico ≥6.5 % (se confirma con otra prueba si no hay síntomas claros); meta frecuente &lt;7 % en adultos, menos estricta en adultos mayores con comorbilidades; en niños y adolescentes la ADA propone &lt;7 %, que puede diferir del material.</p>${rfs('a1ccat+adaDx')}<div class="row"><select id="a1x"><option value="s">Sin diagnóstico de diabetes</option><option value="d">Diabetes en tratamiento</option></select><input id="a1v" type="number" step="0.1" placeholder="HbA1c %" style="width:110px"><button class="p" onclick="a1c()">Interpretar</button></div><div id="a1o"></div></div>`};
function hbc(){const h=HB[+$('#hbp').value],v=parseFloat($('#hbv').value);if(isNaN(v)){$('#hbo').textContent='Ingresa la hemoglobina.';return}$('#hbo').innerHTML=`<p><b>${h[0]}: ${v} g/dL → ${v>=h[1]?'Sin anemia':v>=h[2]?'Anemia leve':v>=h[3]?'Anemia moderada':'Anemia grave'}</b></p>`}
function a1c(){const v=parseFloat($('#a1v').value),s=$('#a1x').value=='s';if(isNaN(v)){$('#a1o').textContent='Ingresa la HbA1c.';return}let r=s?(v<5.7?'Normal':v<6.5?'Prediabetes':'Compatible con diabetes (confirmar)'):(v<7?'Control adecuado':v<8?'Por encima de la meta; puede tolerarse en adultos mayores o niños según el material':'Diabetes mal controlada');$('#a1o').innerHTML=`<p><b>${v} % → ${r}</b></p>`}
go('home');
</script></body></html>
